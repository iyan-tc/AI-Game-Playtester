name: Maintainer model validation
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to verify on bundled demo
        type: choice
        options: [gpt-6.1-terra, glm-4.6v, gemini-2.5-flash]
permissions:
  contents: read
concurrency:
  group: paid-demo
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1
    environment: model-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', cache: ''}
      - run: pip install -e . && python -m playwright install --with-deps chromium
      - name: Two decisions on the bundled game
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAYTEST_MODEL: ${{ inputs.model }}
          PLAYTEST_MAX_BUDGET_USD: '0.05'
        run: |
          umask 077
          if ! python -m playtester.demo --paid --steps 2 --metrics metrics.json >"$RUNNER_TEMP/demo.log" 2>&1; then
            echo 'Paid demo validation failed. Model response and application logs are private.'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numeric-demo-metrics
          path: metrics.json
          retention-days: 14

